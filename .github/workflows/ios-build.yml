name: Build & Upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Add iOS Platform
        run: npx cap add ios || true

      - name: Generate App Icons
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");

          const iconDir = path.join("ios", "App", "App", "Assets.xcassets", "AppIcon.appiconset");
          fs.mkdirSync(iconDir, { recursive: true });

          const src = path.join("resources", "icon.png");

          const sizes = [
            { size: 20, scale: 2, idiom: "iphone" },
            { size: 20, scale: 3, idiom: "iphone" },
            { size: 29, scale: 2, idiom: "iphone" },
            { size: 29, scale: 3, idiom: "iphone" },
            { size: 40, scale: 2, idiom: "iphone" },
            { size: 40, scale: 3, idiom: "iphone" },
            { size: 60, scale: 2, idiom: "iphone" },
            { size: 60, scale: 3, idiom: "iphone" },
            { size: 20, scale: 1, idiom: "ipad" },
            { size: 20, scale: 2, idiom: "ipad" },
            { size: 29, scale: 1, idiom: "ipad" },
            { size: 29, scale: 2, idiom: "ipad" },
            { size: 40, scale: 1, idiom: "ipad" },
            { size: 40, scale: 2, idiom: "ipad" },
            { size: 76, scale: 1, idiom: "ipad" },
            { size: 76, scale: 2, idiom: "ipad" },
            { size: 83.5, scale: 2, idiom: "ipad" },
            { size: 1024, scale: 1, idiom: "ios-marketing" }
          ];

          async function buildIcons() {
            const images = [];
            for (const item of sizes) {
              const px = Math.round(item.size * item.scale);
              const filename = `AppIcon-${item.size}x${item.size}@${item.scale}x.png`;
              await sharp(src).resize(px, px).toFile(path.join(iconDir, filename));
              images.push({
                size: `${item.size}x${item.size}`,
                idiom: item.idiom,
                filename: filename,
                scale: `${item.scale}x`
              });
            }
            fs.writeFileSync(path.join(iconDir, "Contents.json"), JSON.stringify({ images, info: { version: 1, author: "xcode" } }, null, 2));
            console.log("iOS icons generated successfully!");
          }
          buildIcons();
          '

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build and Upload via Fastlane
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          BUNDLE_ID: "com.limonmedia.glovebox"
        run: fastlane ios beta
