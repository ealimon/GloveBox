name: Build & Upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Add iOS Platform
        run: npx cap add ios || true

      - name: Generate App Icons
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          SRC="resources/icon.png"

          # Native macOS image resizing
          sips -z 40 40     "$SRC" --out "$ICON_DIR/AppIcon-20x20@2x.png"
          sips -z 60 60     "$SRC" --out "$ICON_DIR/AppIcon-20x20@3x.png"
          sips -z 58 58     "$SRC" --out "$ICON_DIR/AppIcon-29x29@2x.png"
          sips -z 87 87     "$SRC" --out "$ICON_DIR/AppIcon-29x29@3x.png"
          sips -z 80 80     "$SRC" --out "$ICON_DIR/AppIcon-40x40@2x.png"
          sips -z 120 120   "$SRC" --out "$ICON_DIR/AppIcon-40x40@3x.png"
          sips -z 120 120   "$SRC" --out "$ICON_DIR/AppIcon-60x60@2x.png"
          sips -z 180 180   "$SRC" --out "$ICON_DIR/AppIcon-60x60@3x.png"
          sips -z 20 20     "$SRC" --out "$ICON_DIR/AppIcon-20x20@1x.png"
          sips -z 29 29     "$SRC" --out "$ICON_DIR/AppIcon-29x29@1x.png"
          sips -z 40 40     "$SRC" --out "$ICON_DIR/AppIcon-40x40@1x.png"
          sips -z 76 76     "$SRC" --out "$ICON_DIR/AppIcon-76x76@1x.png"
          sips -z 152 152   "$SRC" --out "$ICON_DIR/AppIcon-76x76@2x.png"
          sips -z 167 167   "$SRC" --out "$ICON_DIR/AppIcon-83.5x83.5@2x.png"
          sips -z 1024 1024 "$SRC" --out "$ICON_DIR/AppIcon-512@2x.png"

          cat << 'EOF' > "$ICON_DIR/Contents.json"
          {
            "images": [
              { "size": "20x20", "idiom": "iphone", "filename": "AppIcon-20x20@2x.png", "scale": "2x" },
              { "size": "20x20", "idiom": "iphone", "filename": "AppIcon-20x20@3x.png", "scale": "3x" },
              { "size": "29x29", "idiom": "iphone", "filename": "AppIcon-29x29@2x.png", "scale": "2x" },
              { "size": "29x29", "idiom": "iphone", "filename": "AppIcon-29x29@3x.png", "scale": "3x" },
              { "size": "40x40", "idiom": "iphone", "filename": "AppIcon-40x40@2x.png", "scale": "2x" },
              { "size": "40x40", "idiom": "iphone", "filename": "AppIcon-40x40@3x.png", "scale": "3x" },
              { "size": "60x60", "idiom": "iphone", "filename": "AppIcon-60x60@2x.png", "scale": "2x" },
              { "size": "60x60", "idiom": "iphone", "filename": "AppIcon-60x60@3x.png", "scale": "3x" },
              { "size": "20x20", "idiom": "ipad", "filename": "AppIcon-20x20@1x.png", "scale": "1x" },
              { "size": "20x20", "idiom": "ipad", "filename": "AppIcon-20x20@2x.png", "scale": "2x" },
              { "size": "29x29", "idiom": "ipad", "filename": "AppIcon-29x29@1x.png", "scale": "1x" },
              { "size": "29x29", "idiom": "ipad", "filename": "AppIcon-29x29@2x.png", "scale": "2x" },
              { "size": "40x40", "idiom": "ipad", "filename": "AppIcon-40x40@1x.png", "scale": "1x" },
              { "size": "40x40", "idiom": "ipad", "filename": "AppIcon-40x40@2x.png", "scale": "2x" },
              { "size": "76x76", "idiom": "ipad", "filename": "AppIcon-76x76@1x.png", "scale": "1x" },
              { "size": "76x76", "idiom": "ipad", "filename": "AppIcon-76x76@2x.png", "scale": "2x" },
              { "size": "83.5x83.5", "idiom": "ipad", "filename": "AppIcon-83.5x83.5@2x.png", "scale": "2x" },
              { "size": "1024x1024", "idiom": "ios-marketing", "filename": "AppIcon-512@2x.png", "scale": "1x" }
            ],
            "info": {
              "version": 1,
              "author": "xcode"
            }
          }
          EOF

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build and Upload via Fastlane
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          BUNDLE_ID: "com.limonmedia.glovebox"
        run: fastlane ios beta
